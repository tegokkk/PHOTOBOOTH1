<style>
        .hard-shadow { box-shadow: 8px 8px 0px 0px var(--tw-colors-ink-black); }

        }

        .tape-corner {
            position: absolute;
            background: var(--tw-colors-ink-black);
            width: 40px;
            height: 12px;
            transform: rotate(45deg);
            z-index: 10;
        }
        .tape-tl { top: -2px; left: -14px; transform: rotate(-45deg); }
        .tape-tr { top: -2px; right: -14px; transform: rotate(45deg); }
        .tape-bl { bottom: -2px; left: -14px; transform: rotate(45deg); }
        .tape-br { bottom: -2px; right: -14px; transform: rotate(-45deg); }

        /* Window controls */
        .window-ctrl { width: 12px; height: 12px; border: 2px solid var(--tw-colors-ink-black); display: inline-block; margin-right: 4px; }
        .ctrl-min { background-color: var(--tw-colors-stark-white); }
        .ctrl-max { background-color: var(--tw-colors-stark-white); }
        .ctrl-close { background-color: var(--tw-colors-error-red); }

        /* Glitch text effect for countdown */
        .glitch-text {
            position: relative;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 var(--tw-colors-error-red);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 var(--tw-colors-neon-yellow);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(2px, 9999px, 86px, 0); }
            20% { clip: rect(72px, 9999px, 21px, 0); }
            40% { clip: rect(100px, 9999px, 49px, 0); }
            60% { clip: rect(48px, 9999px, 90px, 0); }
            80% { clip: rect(81px, 9999px, 16px, 0); }
            100% { clip: rect(32px, 9999px, 73px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(82px, 9999px, 16px, 0); }
            20% { clip: rect(20px, 9999px, 51px, 0); }
            40% { clip: rect(60px, 9999px, 89px, 0); }
            60% { clip: rect(18px, 9999px, 20px, 0); }
            80% { clip: rect(71px, 9999px, 16px, 0); }
            100% { clip: rect(52px, 9999px, 33px, 0); }
        }
    </style>

<script>
        // Simple script to cycle the countdown for demonstration
        const countdownEl = document.querySelector('.glitch-text');
        let count = 3;
        setInterval(() => {
            count--;
            if (count < 1) count = 3;
            countdownEl.textContent = count;
            countdownEl.setAttribute('data-text', count);
        }, 1000);
