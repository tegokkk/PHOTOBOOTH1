<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Tilted 3-slot zigzag thermal photo strip -->
  <g transform="rotate(14 114 128)">
    <!-- Strip body with top and bottom zigzag serrated edges -->
    <path
      d="M64 26 L74 18 L84 26 L94 18 L104 26 L114 18 L124 26 L134 18 L144 26 L154 18 L164 26 L164 230 L154 238 L144 230 L134 238 L124 230 L114 238 L104 230 L94 238 L84 230 L74 238 L64 230 Z"
      fill="#FFFFFF"
      stroke="#0F172A"
      stroke-width="8"
      stroke-linejoin="round"
    />

    <!-- Slot 1: Viewfinder crosshair -->
    <rect x="78" y="42" width="72" height="50" fill="#0038FF" />
    <rect x="85" y="49" width="58" height="36" fill="#FFFFFF" />
    <path d="M92 60 V54 H98 M130 54 H136 V60 M92 74 V80 H98 M130 80 H136 V74" stroke="#0038FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M114 60 V74 M107 67 H121" stroke="#0038FF" stroke-width="3.5" stroke-linecap="round" />

    <!-- Slot 2: Sparkles -->
    <rect x="78" y="103" width="72" height="50" fill="#0038FF" />
    <rect x="85" y="110" width="58" height="36" fill="#FFFFFF" />
    <path d="M98 117 L101 124 L108 127 L101 130 L98 137 L95 130 L88 127 L95 124 Z" fill="#0038FF" />
    <path d="M114 125 L116 129 L120 131 L116 133 L114 137 L112 133 L108 131 L112 129 Z" fill="#0038FF" />

    <!-- Slot 3: Inner photo frame -->
    <rect x="78" y="164" width="72" height="50" fill="#0038FF" />
    <rect x="85" y="171" width="58" height="36" fill="#FFFFFF" />
    <rect x="91" y="177" width="46" height="24" stroke="#0038FF" stroke-width="3" fill="none" />
  </g>

  <!-- Click spark lines -->
  <path d="M178 134 L184 118 M193 142 L208 130 M198 156 L214 156" stroke="#0038FF" stroke-width="6" stroke-linecap="round" />

  <!-- Neon Lime Pointer Cursor -->
  <path
    d="M148 152 L176 226 L190 205 L212 227 L226 213 L204 191 L224 176 Z"
    fill="#CCFF00"
    stroke="#0F172A"
    stroke-width="8"
    stroke-linejoin="round"
  />
</svg>
