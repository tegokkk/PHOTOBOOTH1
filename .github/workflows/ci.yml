name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/photobooth_test
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photobooth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d photobooth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Configure CI runtime secret
      shell: bash
      run: echo "JWT_SECRET=ci-$(date +%s)-riri-test-secret" >> "$GITHUB_ENV"
        
    - name: Backend - Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Backend - Run Prisma Generate
      working-directory: ./backend
      run: npx prisma generate

    - name: Backend - Validate Prisma Schema
      working-directory: ./backend
      run: npx prisma validate

    - name: Backend - Apply Migrations
      working-directory: ./backend
      run: npx prisma migrate deploy

    - name: Backend - Run Tests
      working-directory: ./backend
      run: npm test

    - name: Backend - Audit Production Dependencies
      working-directory: ./backend
      run: npm audit --omit=dev --audit-level=high

    - name: Frontend - Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Frontend - Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Frontend - Audit Dependencies
      working-directory: ./frontend
      run: npm audit --omit=dev --audit-level=high

    - name: Frontend - Build
      working-directory: ./frontend
      run: npm run build
